// ---- 1.16.2 ----
include("authsuite-fabric-1.16.2")
include("authsuite-forge-1.16.2")

// ---- 1.16.1 ----
include("authsuite-fabric-1.16.1")
include("authsuite-forge-1.16.1")

// ---- 1.17 ----
// Forge has no 1.17 build (only 1.17.1); Fabric ships.
include("authsuite-fabric-1.17")

// ---- 1.18 ----
include("authsuite-fabric-1.18")
include("authsuite-forge-1.18")

// ---- 1.18.1 ----
include("authsuite-fabric-1.18.1")
include("authsuite-forge-1.18.1")

